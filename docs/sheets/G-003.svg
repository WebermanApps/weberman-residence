<svg xmlns="http://www.w3.org/2000/svg" width="841mm" height="594mm" viewBox="0 0 841 594"><rect width="841" height="594" fill="#ffffff"/><rect x="8.00" y="8.00" width="825.00" height="578.00" rx="0" fill="none" stroke="#0a0a0a" stroke-width="0.7"/><line x1="765.00" y1="8.00" x2="765.00" y2="586.00" stroke="#0a0a0a" stroke-width="0.7" stroke-linecap="butt"/><text x="770.00" y="20.00" font-family="Khand" font-size="8" font-weight="600" text-anchor="start" fill="#0a0a0a">WEBERMAN</text><text x="770.00" y="28.00" font-family="Khand" font-size="8" font-weight="600" text-anchor="start" fill="#0a0a0a">RESIDENCE</text><text x="770.00" y="35.00" font-family="Hind" font-size="2.4" font-weight="400" text-anchor="start" fill="#404040">Mountain courtyard house, Thailand</text><text x="770.00" y="39.00" font-family="Hind" font-size="2.4" font-weight="400" text-anchor="start" fill="#404040">Owner: Max Weberman</text><line x1="765.00" y1="44.00" x2="833.00" y2="44.00" stroke="#0a0a0a" stroke-width="0.35" stroke-linecap="butt"/><text x="770.00" y="51.00" font-family="Hind" font-size="2.2" font-weight="600" text-anchor="start" fill="#737373" letter-spacing="0.3">ISSUE</text><text x="770.00" y="57.00" font-family="Hind" font-size="3.6" font-weight="600" text-anchor="start" fill="#0a0a0a">Design Development</text><rect x="769.00" y="61.00" width="60.00" height="9.00" rx="0" fill="#0a0a0a" stroke="none" stroke-width="0.25"/><text x="799.00" y="67.00" font-family="Khand" font-size="3.3" font-weight="600" text-anchor="middle" fill="#fafafa" letter-spacing="0.4">NOT FOR CONSTRUCTION</text><line x1="765.00" y1="76.00" x2="833.00" y2="76.00" stroke="#0a0a0a" stroke-width="0.35" stroke-linecap="butt"/><text x="770.00" y="84.00" font-family="Hind" font-size="2.0" font-weight="600" text-anchor="start" fill="#737373">DATE</text><text x="770.00" y="88.20" font-family="Hind" font-size="2.8" font-weight="400" text-anchor="start" fill="#0a0a0a">11 Oct 2026</text><text x="770.00" y="95.00" font-family="Hind" font-size="2.0" font-weight="600" text-anchor="start" fill="#737373">SCALE</text><text x="770.00" y="99.20" font-family="Hind" font-size="2.8" font-weight="400" text-anchor="start" fill="#0a0a0a">NTS</text><text x="770.00" y="106.00" font-family="Hind" font-size="2.0" font-weight="600" text-anchor="start" fill="#737373">MODEL</text><text x="770.00" y="110.20" font-family="Hind" font-size="2.8" font-weight="400" text-anchor="start" fill="#0a0a0a">bim.json (from plan.json)</text><text x="770.00" y="117.00" font-family="Hind" font-size="2.0" font-weight="600" text-anchor="start" fill="#737373">UNITS</text><text x="770.00" y="121.20" font-family="Hind" font-size="2.8" font-weight="400" text-anchor="start" fill="#0a0a0a">Feet + inches (mm for members)</text><text x="770.00" y="128.00" font-family="Hind" font-size="2.0" font-weight="600" text-anchor="start" fill="#737373">REVISION</text><text x="770.00" y="132.20" font-family="Hind" font-size="2.8" font-weight="400" text-anchor="start" fill="#0a0a0a">DD-01</text><line x1="765.00" y1="524.00" x2="833.00" y2="524.00" stroke="#0a0a0a" stroke-width="0.35" stroke-linecap="butt"/><text x="770.00" y="531.00" font-family="Hind" font-size="2.0" font-weight="600" text-anchor="start" fill="#737373">SHEET TITLE</text><text x="770.00" y="538.00" font-family="Khand" font-size="4.4" font-weight="600" text-anchor="start" fill="#0a0a0a">Construction Standards</text><text x="770.00" y="543.50" font-family="Khand" font-size="4.4" font-weight="600" text-anchor="start" fill="#0a0a0a">(Thai vs Western)</text><line x1="765.00" y1="558.00" x2="833.00" y2="558.00" stroke="#0a0a0a" stroke-width="0.35" stroke-linecap="butt"/><text x="770.00" y="564.00" font-family="Hind" font-size="2.0" font-weight="600" text-anchor="start" fill="#737373">SHEET</text><text x="770.00" y="580.00" font-family="Khand" font-size="15" font-weight="600" text-anchor="start" fill="#0a0a0a">G-003</text><text x="829.00" y="580.00" font-family="Hind" font-size="2.4" font-weight="400" text-anchor="end" fill="#737373">3 of 17</text><text x="40.00" y="50.00" font-family="Khand" font-size="16" font-weight="600" text-anchor="start" fill="#0a0a0a" letter-spacing="0.6">CONSTRUCTION STANDARDS: THAI VS WESTERN</text><text x="40.00" y="61.00" font-family="Hind" font-size="3.6" font-weight="400" text-anchor="start" fill="#404040">Approved project standard (Oct 11 2026). Applies to every sheet and to the element properties in the 3D model.</text><rect x="40.00" y="72.00" width="700.00" height="4.55" rx="0" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="0.2"/><text x="41.00" y="75.35" font-family="Hind" font-size="2.21" font-weight="600" text-anchor="start" fill="#404040">TOPIC</text><text x="121.00" y="75.35" font-family="Hind" font-size="2.21" font-weight="600" text-anchor="start" fill="#404040">COMMON THAI PRACTICE</text><text x="341.00" y="75.35" font-family="Hind" font-size="2.21" font-weight="600" text-anchor="start" fill="#404040">OUR STANDARD</text><text x="561.00" y="75.35" font-family="Hind" font-size="2.21" font-weight="600" text-anchor="start" fill="#404040">WHY</text><text x="41.00" y="79.90" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Structure</text><text x="121.00" y="79.90" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">RC frame with brick infill; timber roof/floor framing common</text><text x="341.00" y="79.90" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">RC frame (columns, beams, slabs); steel roof framing; no timber framing</text><text x="561.00" y="79.90" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Termites and humidity destroy timber; RC + steel is durable and insurable</text><line x1="40.00" y1="81.10" x2="740.00" y2="81.10" stroke="#d4d4d4" stroke-width="0.1" stroke-linecap="butt"/><text x="41.00" y="84.45" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Exterior Walls</text><text x="121.00" y="84.45" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Single-skin red clay brick or thin block, cement render, no insulation</text><text x="341.00" y="84.45" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">200 mm AAC + exterior insulation or ventilated charred-timber cladding; lime plaster</text><text x="561.00" y="84.45" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Cuts heat gain and AC load; breathable lime resists mould</text><line x1="40.00" y1="85.65" x2="740.00" y2="85.65" stroke="#d4d4d4" stroke-width="0.1" stroke-linecap="butt"/><text x="41.00" y="89.00" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Interior Partitions</text><text x="121.00" y="89.00" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Clay brick / block, rendered</text><text x="341.00" y="89.00" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Light-gauge steel studs with board; acoustic wool at studio + bedrooms</text><text x="561.00" y="89.00" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Lighter, straighter, quieter; termite-proof; easy service routing</text><line x1="40.00" y1="90.20" x2="740.00" y2="90.20" stroke="#d4d4d4" stroke-width="0.1" stroke-linecap="butt"/><text x="41.00" y="93.55" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Concrete Walls</text><text x="121.00" y="93.55" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Poured where convenient</text><text x="341.00" y="93.55" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Only pool, retaining, cistern, engineer-required shear walls</text><text x="561.00" y="93.55" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Less embodied carbon and heat mass where not needed</text><line x1="40.00" y1="94.75" x2="740.00" y2="94.75" stroke="#d4d4d4" stroke-width="0.1" stroke-linecap="butt"/><text x="41.00" y="98.10" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Roof</text><text x="121.00" y="98.10" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Metal sheet or tile on timber/steel, foil at best, little insulation</text><text x="341.00" y="98.10" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Metal over radiant barrier, 75 mm insulation, ventilated cavity</text><text x="561.00" y="98.10" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Hot-roof heat is the #1 cooling load; quiet in monsoon rain</text><line x1="40.00" y1="99.30" x2="740.00" y2="99.30" stroke="#d4d4d4" stroke-width="0.1" stroke-linecap="butt"/><text x="41.00" y="102.65" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Traps</text><text x="121.00" y="102.65" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Bottle traps or none; floor drains often untrapped (smell)</text><text x="341.00" y="102.65" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">P-trap on every fixture; deep-seal trapped floor drains with trap primers</text><text x="561.00" y="102.65" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Stops sewer gas, insects and odours</text><line x1="40.00" y1="103.85" x2="740.00" y2="103.85" stroke="#d4d4d4" stroke-width="0.1" stroke-linecap="butt"/><text x="41.00" y="107.20" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Venting</text><text x="121.00" y="107.20" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Often unvented; drains glug and siphon traps</text><text x="341.00" y="107.20" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Proper vent stack system through the roof</text><text x="561.00" y="107.20" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Keeps trap seals; fast, quiet drainage</text><line x1="40.00" y1="108.40" x2="740.00" y2="108.40" stroke="#d4d4d4" stroke-width="0.1" stroke-linecap="butt"/><text x="41.00" y="111.75" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Grease</text><text x="121.00" y="111.75" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Kitchen waste straight to sewer/septic</text><text x="341.00" y="111.75" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Kitchen grease interceptor GT-1 before septic</text><text x="561.00" y="111.75" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Protects septic + ATU and drain field</text><line x1="40.00" y1="112.95" x2="740.00" y2="112.95" stroke="#d4d4d4" stroke-width="0.1" stroke-linecap="butt"/><text x="41.00" y="116.30" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Water Supply</text><text x="121.00" y="116.30" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">PVC cold + mixed fittings, rarely tested</text><text x="341.00" y="116.30" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">PPR fusion-welded, pressure-tested before walls close</text><text x="561.00" y="116.30" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">No hidden leaks; rated for hot water</text><line x1="40.00" y1="117.50" x2="740.00" y2="117.50" stroke="#d4d4d4" stroke-width="0.1" stroke-linecap="butt"/><text x="41.00" y="120.85" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Electrical</text><text x="121.00" y="120.85" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Partial earthing, RCD on some circuits, ad-hoc panel</text><text x="341.00" y="120.85" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">TN-C-S earthing, 30 mA RCBO on all circuits, full panel schedule</text><text x="561.00" y="120.85" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Shock + fire safety in a wet climate</text><line x1="40.00" y1="122.05" x2="740.00" y2="122.05" stroke="#d4d4d4" stroke-width="0.1" stroke-linecap="butt"/><text x="41.00" y="125.40" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Wet Areas</text><text x="121.00" y="125.40" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Tile on render; leaks common</text><text x="341.00" y="125.40" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Waterproofing membrane in all wet areas, flood-tested 24 h</text><text x="561.00" y="125.40" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Prevents leaks and mould into AAC + studs</text><line x1="40.00" y1="126.60" x2="740.00" y2="126.60" stroke="#d4d4d4" stroke-width="0.1" stroke-linecap="butt"/><text x="41.00" y="129.95" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Hot Water</text><text x="121.00" y="129.95" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Point-of-use electric heaters at each shower</text><text x="341.00" y="129.95" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">Central heat-pump water heater + recirculation</text><text x="561.00" y="129.95" font-family="Hind" font-size="2.6" font-weight="400" text-anchor="start" fill="#0a0a0a">~3x more efficient; one serviceable unit; instant hot water</text><line x1="40.00" y1="131.15" x2="740.00" y2="131.15" stroke="#d4d4d4" stroke-width="0.1" stroke-linecap="butt"/><text x="40.00" y="145.15" font-family="Khand" font-size="2.6" font-weight="600" text-anchor="start" fill="#0a0a0a" letter-spacing="0.3">WALL TYPES</text><polygon points="43.18,149.15 44.09,147.85 45.91,147.85 46.82,149.15 45.91,150.45 44.09,150.45" fill="#ffffff" stroke="#0a0a0a" stroke-width="0.2" stroke-linejoin="round"/><text x="45.00" y="149.73" font-family="Khand" font-size="1.4949999999999999" font-weight="600" text-anchor="middle" fill="#0a0a0a">W1</text><text x="53.00" y="150.15" font-family="Hind" font-size="2.3" font-weight="400" text-anchor="start" fill="#0a0a0a">W1 AAC Exterior: 200 mm AAC block in RC frame; exterior insulation or ventilated charred-timber cladding; lime plaster</text><polygon points="43.18,153.75 44.09,152.45 45.91,152.45 46.82,153.75 45.91,155.05 44.09,155.05" fill="#ffffff" stroke="#0a0a0a" stroke-width="0.2" stroke-linejoin="round"/><text x="45.00" y="154.33" font-family="Khand" font-size="1.4949999999999999" font-weight="600" text-anchor="middle" fill="#0a0a0a">W2</text><text x="53.00" y="154.75" font-family="Hind" font-size="2.3" font-weight="400" text-anchor="start" fill="#0a0a0a">W2 Steel Stud: 92 mm LGS @ 400 mm, board both sides, mineral wool; cement board + membrane on wet faces</text><polygon points="43.18,158.35 44.09,157.05 45.91,157.05 46.82,158.35 45.91,159.65 44.09,159.65" fill="#ffffff" stroke="#0a0a0a" stroke-width="0.2" stroke-linejoin="round"/><text x="45.00" y="158.93" font-family="Khand" font-size="1.4949999999999999" font-weight="600" text-anchor="middle" fill="#0a0a0a">W3</text><text x="53.00" y="159.35" font-family="Hind" font-size="2.3" font-weight="400" text-anchor="start" fill="#0a0a0a">W3 Acoustic Stud: Double/isolated LGS, 75 mm acoustic wool, 2 x sound board, resilient channel (studio + bedrooms)</text><polygon points="43.18,162.95 44.09,161.65 45.91,161.65 46.82,162.95 45.91,164.25 44.09,164.25" fill="#ffffff" stroke="#0a0a0a" stroke-width="0.2" stroke-linejoin="round"/><text x="45.00" y="163.53" font-family="Khand" font-size="1.4949999999999999" font-weight="600" text-anchor="middle" fill="#0a0a0a">W4</text><text x="53.00" y="163.95" font-family="Hind" font-size="2.3" font-weight="400" text-anchor="start" fill="#0a0a0a">W4 RC Wall: Poured RC: pool, retaining walls, cistern, engineer-required shear walls only</text><text x="770.00" y="143.00" font-family="Hind" font-size="2.0" font-weight="600" text-anchor="start" fill="#737373">NOTES</text><text x="770.00" y="147.50" font-family="Hind" font-size="2.2" font-weight="400" text-anchor="start" fill="#0a0a0a">Western standard = trapped + vented DWV,</text><text x="770.00" y="150.70" font-family="Hind" font-size="2.2" font-weight="400" text-anchor="start" fill="#0a0a0a">tested PPR, full earthing + RCBO,</text><text x="770.00" y="153.90" font-family="Hind" font-size="2.2" font-weight="400" text-anchor="start" fill="#0a0a0a">membranes, central hot water.</text><text x="770.00" y="158.30" font-family="Hind" font-size="2.2" font-weight="400" text-anchor="start" fill="#0a0a0a">Engineer to confirm shear walls (W4) and</text><text x="770.00" y="161.50" font-family="Hind" font-size="2.2" font-weight="400" text-anchor="start" fill="#0a0a0a">all member sizes.</text></svg>